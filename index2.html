<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://kit.fontawesome.com/4ea1695061.js" crossorigin="anonymous"></script>
    
</head>
<body>
    
    <header id="head">
        
        <button id="sidebtn" class="btn1">///</button>
        <h1 id="headtext">Grade 12 Exam</h1>
    </header>

    <aside id="side">
        
        <div id="all">
            <h2 id="name">MR88</h2>
            <h4 id="theme">Theme</h4>
            <select id="select">
                <option id="blue" value="dodgerblue">Blue</option>
                <option id="green" value="lightgreen">Green</option>
                <option id="orange" value="Orange">Orange</option>
                <option id="red" value="tomato">Red</option>
            </select>
        </div>
        <button id="hideside" class="btn1">+</button>
    </aside>
    
    <div id="content">

    
        <div id="card">
            <h2 id="num-question">Q0</h2>
            <p id="question">Whats Your name?</p>
            <div id="options">
                <p id="opa" class="op">A</p>
                <p id="opb" class="op">B</p>
                <p id="opc" class="op">C</p>
                <p id="opd" class="op">D</p>
            </div>
            <div id="answers">
                <button id="A" class="btn" class="btn1"><i class="fa-solid fa-font" style="color: black;"></i></button>
                <button id="B" class="btn" class="btn1"><i class="fa-solid fa-b" style="color: black;"></i></button>
                <button id="C" class="btn" class="btn1"><i class="fa-solid fa-c" style="color: black"></i></button>
                <button id="D" class="btn"  class="btn1"><i class="fa-solid fa-d" style="color: black;"></i></button>
            </div>
            <div id="btm">
                <p id="score"></p>
                <button id="next" class="btn1">Next</button>
            </div>

        </div>
    </div>
    <script src="index2.js"></script>
</body>
</html>
