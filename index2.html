<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Exam</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <aside id="side">
        
        <div id="all">
            <h2 id="name">MR Exam</h2>
            <h4 id="theme">Theme</h4>
            <select id="select">
                <option id="blue" value="dodgerblue">Blue</option>
                <option id="green" value="lightgreen">Green</option>
                <option id="orange" value="orange">Orange</option>
                <option id="red" value="tomato">Red</option>
            </select>
        </div>
        <button id="hideside" class="btn1">X</button>
    </aside>
    

    <header id="head">
        <button id="sidebtn" class="btn1">///</button>
        <h1 id="name">MR Exam</h1>
        <div id="cate">
            <p id="facebook">F</p>
            <p id="telegram">T</p>
            <p id="help">H</p>
        </div>
    </header>
    <footer class="foot">
        <form id="quiz-form"> 

            <div class="rdiv">
                <input id="squiz" type="radio" name="quizes">
                <label for="squiz">5 Questions</label>

            </div>

            <div class="rdiv">
                
                <input id="quiz" type="radio" name="quizes">
                <label for="quiz">10 Questions</label>
            </div>

            <div class="rdiv">
                <input id="lquiz" type="radio" name="quizes">
                <label for="lquiz">20 Questions</label>
                
            </div>

            <div class="rdiv">
                <input id="fexam" type="radio" name="quizes">
                <label for="fexam">All Questions</label>
                
            </div>
    
    
        </form>

        <button id="next">Next</button>
        <button id="cancel">Cancel</button>
    </footer>
    <div id="cards">
    </div>
    <script src="index.js"></script>
</body>
</html>
